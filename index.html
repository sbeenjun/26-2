<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>적벽의 밤 — 蘇軾 〈念奴嬌·赤壁懷古〉</title>
<style>
  :root{
    --app-height:100%;
    --text:#e9e4d9; --sub:#94a4b5; --dim:#6b7c8d;
    --moon:#f2ebda; --accent:#a4614d; --line:rgba(170,190,210,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%; max-width:100%; margin:0; padding:0;
    overflow-x:hidden; overflow-y:hidden;
  }
  body{
    background:#03060b; color:var(--text);
    font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
    overscroll-behavior:none; -webkit-font-smoothing:antialiased;
    -webkit-user-select:none; user-select:none;
  }

  /* ── 앱 전체 : 실제 viewport 높이(JS로 주입) 기준 ── */
  #app{
    width:100%;
    height:var(--app-height);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    padding-left:calc(6px + env(safe-area-inset-left));
    padding-right:calc(6px + env(safe-area-inset-right));
  }

  /* ── 게임 화면 : 크기는 JS가 px로 지정 ── */
  #frame{
    position:relative;
    flex:0 0 auto;
    max-width:100%;
    border:1px solid var(--line); border-radius:4px; overflow:hidden;
    background:#060b13;
    touch-action:none;
  }
  #frame:focus{outline:none;}
  #frame:focus-visible{outline:2px solid #b7cbdd; outline-offset:2px;}
  canvas{display:block; width:100%; height:100%;}

  /* ── HUD ── */
  .hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:flex-start; gap:8px; padding:7px 10px;
    font-size:11px; letter-spacing:.14em; color:var(--dim);
    text-shadow:0 1px 3px rgba(0,0,0,.85); pointer-events:none;
    transition:opacity .8s ease;
  }
  .hud.fade{opacity:0;}
  .hud .title{color:var(--sub); white-space:nowrap;}
  .hud .steps{margin-left:auto; display:flex; align-items:center; gap:5px; white-space:nowrap;}
  .hud .steps span{transition:color .6s ease;}
  .hud .steps .on{color:var(--moon);}
  .hud .steps i{font-style:normal; color:rgba(107,124,141,.5);}

  .gauge{
    position:absolute; top:28px; left:10px; right:10px;
    display:flex; align-items:center; gap:7px; min-width:0;
    opacity:0; transition:opacity .5s ease; pointer-events:none;
  }
  .gauge.on{opacity:1;}
  .gauge .lb{font-size:10px; letter-spacing:.18em; color:var(--sub); text-shadow:0 1px 3px #000;}
  .gauge .track{position:relative; flex:1 1 auto; min-width:0; max-width:210px; height:3px; background:rgba(140,160,180,.2);}
  .gauge .fill{position:absolute; inset:0 auto 0 0; width:20%;
    background:linear-gradient(90deg, rgba(164,97,77,.75), rgba(232,206,178,.95));
    transition:width .25s ease;}
  .gauge .combo{margin-left:auto; font-size:10.5px; letter-spacing:.12em; color:var(--moon);
    opacity:0; transition:opacity .3s ease; text-shadow:0 1px 3px #000; white-space:nowrap;}
  .gauge .combo.on{opacity:.9;}

  /* ── 자막 : 화면 높이의 30% 이내 ── */
  .cap{
    position:absolute; left:0; right:0; bottom:0;
    max-height:32%; overflow:hidden;
    padding:10px 12px 11px;
    background:linear-gradient(180deg, rgba(4,8,14,0), rgba(4,8,14,.82) 45%);
    opacity:0; transition:opacity .45s ease; pointer-events:none; text-align:center;
  }
  .cap.on{opacity:1;}
  .cap .hz{margin:0 0 3px; font-size:clamp(14px,4.4vw,24px); letter-spacing:.07em; color:var(--moon); line-height:1.45; word-break:keep-all;}
  .cap .rd{margin:0; font-size:clamp(9px,2.4vw,11.5px); letter-spacing:.1em; color:var(--dim);}
  .cap .nt{margin:3px 0 0; font-size:clamp(10px,2.8vw,13px); line-height:1.55; color:var(--sub); word-break:keep-all;}

  /* ── 프롬프트 ── */
  .prompt{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    max-width:92%;
    background:rgba(6,11,18,.85); border:1px solid var(--line); border-radius:3px;
    padding:5px 12px; font-size:clamp(10px,2.8vw,12px); letter-spacing:.04em;
    white-space:nowrap; opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .prompt.on{opacity:1;}
  .prompt b{color:var(--moon); font-weight:600;}
  .holdbar{
    position:absolute; left:50%; bottom:5px; transform:translateX(-50%);
    width:120px; max-width:60%; height:2px; background:rgba(140,160,180,.22);
    opacity:0; transition:opacity .25s ease;
  }
  .holdbar.on{opacity:1;}
  .holdbar i{display:block; height:100%; width:0; background:var(--moon);}

  /* ── 시작 / 엔딩 ── */
  .screen{
    position:absolute; inset:0; display:none; flex-direction:column; justify-content:center;
    padding:16px 18px;
    background:linear-gradient(180deg, rgba(4,8,14,.5), rgba(3,6,11,.86));
  }
  .screen.on{display:flex; animation:fade .7s ease both;}
  .screen h1{margin:0 0 4px; font-size:clamp(21px,6.4vw,38px); font-weight:600; letter-spacing:.08em; line-height:1.25;}
  .screen .sub{margin:0 0 10px; color:var(--sub); font-size:clamp(10px,2.9vw,13px); line-height:1.6; word-break:keep-all;}
  .screen .lead{margin:0 0 12px; font-size:clamp(11px,3vw,14px); line-height:1.7; word-break:keep-all;}
  .keys{margin:0 0 14px; color:var(--dim); font-size:clamp(9.5px,2.6vw,12px); line-height:1.8;}
  .keys b{color:var(--sub); font-weight:500;}
  .start{
    align-self:flex-start; min-height:46px; padding:11px 22px;
    background:rgba(16,25,36,.9); color:var(--text);
    border:1px solid rgba(198,214,230,.45); border-radius:3px;
    font:inherit; font-size:clamp(12px,3.2vw,14px); letter-spacing:.06em; cursor:pointer;
    touch-action:manipulation;
  }
  .start:hover{background:rgba(32,46,62,.95); border-color:rgba(230,238,246,.7);}
  .start:focus-visible{outline:2px solid #b7cbdd; outline-offset:3px;}

  #ending .verse{margin:0 0 6px; color:var(--moon); font-size:clamp(15px,5vw,28px); line-height:1.6; letter-spacing:.07em; animation:fade 1.2s ease both;}
  #ending .rd{margin:0 0 8px; color:var(--dim); font-size:clamp(9.5px,2.6vw,12px); line-height:1.6; letter-spacing:.07em; animation:fade 1.2s ease .7s both;}
  #ending .tr{margin:0 0 14px; font-size:clamp(10.5px,2.9vw,14px); line-height:1.7; word-break:keep-all; animation:fade 1.2s ease 1.3s both;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}

  /* ── 조작 ── */
  .pad{
    flex:0 0 auto;
    width:100%; max-width:520px;
    display:flex; align-items:center; gap:8px;
    transition:opacity .5s ease;
  }
  .pad.hide{opacity:0; pointer-events:none;}
  .pad .left{display:flex; gap:8px; min-width:0;}
  .pad .right{margin-left:auto; min-width:0;}
  .key{
    min-width:62px; min-height:56px; padding:8px 14px;
    background:rgba(13,21,31,.92); color:var(--text);
    border:1px solid var(--line); border-radius:4px;
    font:inherit; font-size:15px; letter-spacing:.05em;
    cursor:pointer; touch-action:manipulation;
    transition:background .12s ease, border-color .12s ease, opacity .3s ease;
  }
  .key.act{min-width:92px; border-color:rgba(198,214,230,.4);}
  .key.dimmed{opacity:.3;}
  .key:active,.key.down{background:rgba(38,54,72,.95); border-color:rgba(214,228,240,.6);}
  .key:focus-visible{outline:2px solid #b7cbdd; outline-offset:2px;}

  .hint{
    flex:0 0 auto;
    font-size:10px; letter-spacing:.08em; color:rgba(107,124,141,.8);
    text-align:center; line-height:1.4;
  }

  @media (max-width:480px){
    .hud{font-size:10px; padding:6px 8px; letter-spacing:.1em;}
    .gauge{top:25px; left:8px; right:8px;}
    .cap{padding:8px 10px 9px;}
    .hint{font-size:9px;}
    .key{min-width:60px; font-size:14px; padding:8px 10px;}
    .key.act{min-width:84px;}
  }
  @media (min-width:760px){
    #app{gap:10px; padding:10px;}
    .key{min-height:52px; font-size:14px;}
    .hint{font-size:10.5px;}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
</style>
</head>
<body>

<div id="app">
  <div id="frame" tabindex="0" aria-label="적벽의 밤 게임 화면">
    <canvas id="cv"></canvas>

    <div class="hud" id="hud">
      <span class="title">적벽의 밤</span>
      <span class="steps">
        <span id="hz1">赤壁</span><i>→</i>
        <span id="hz2">回想</span><i>→</i>
        <span id="hz3">江月</span>
      </span>
    </div>

    <div class="gauge" id="gauge">
      <span class="lb">回想</span>
      <span class="track"><i class="fill" id="gFill"></i></span>
      <span class="combo" id="combo"></span>
    </div>

    <div class="cap" id="cap">
      <p class="hz" id="capHz"></p>
      <p class="rd" id="capRd"></p>
      <p class="nt" id="capNt"></p>
    </div>

    <div class="prompt" id="prompt"></div>
    <div class="holdbar" id="holdbar"><i id="holdFill"></i></div>

    <div class="screen on" id="title">
      <h1>적벽의 밤</h1>
      <p class="sub">蘇軾 〈念奴嬌·赤壁懷古〉를 바탕으로 한 짧은 게임</p>
      <p class="lead">1082년, 黃州.<br>소식은 어느 밤 홀로 赤壁을 찾는다.</p>
      <p class="keys" id="keysText">PC <b>← →</b> / <b>A D</b> 이동 · <b>SPACE</b> 조사<br>모바일 화면 아래 버튼 사용</p>
      <button class="start" id="btnStart" type="button">시작하기</button>
    </div>

    <div class="screen" id="ending">
      <p class="verse">人間如夢，<br>一尊還酹江月。</p>
      <p class="rd">인간여몽,<br>일준환뢰강월</p>
      <p class="tr">“인생이란 꿈과 같은 것,<br>한 잔 술을 강물에 비친 달에 따르네.”</p>
      <button class="start" id="btnAgain" type="button">다시 시작</button>
    </div>
  </div>

  <div class="pad" id="pad">
    <div class="left">
      <button class="key" id="kL" type="button" aria-label="왼쪽">◀</button>
      <button class="key" id="kR" type="button" aria-label="오른쪽">▶</button>
    </div>
    <div class="right">
      <button class="key act dimmed" id="kA" type="button" aria-label="따르기">따르기</button>
    </div>
  </div>
  <div class="hint" id="hint">← → 이동 · SPACE 길게 누르기</div>
</div>

<script>
(function () {
  "use strict";

  /* ════════════ 캐릭터 이미지 (비워두면 Canvas 캐릭터 사용) ════════════ */
  var CHARACTER_IMAGES = { sushi: "", zhouyu: "" };
  var IMG = { sushi:null, zhouyu:null };
  (function loadImages(){
    ["sushi","zhouyu"].forEach(function(k){
      var p = CHARACTER_IMAGES[k];
      if (!p) return;
      var im = new Image();
      im.onload = function(){ if (im.naturalWidth) IMG[k] = im; };
      im.onerror = function(){ IMG[k] = null; };
      im.src = p;
    });
  })();

  /* ════════════ GAME_CONFIG ════════════ */

  var GAME_CONFIG = {
    viewWide: 960, viewWideH: 540,   // PC 가상 해상도
    viewNarrow: 620,                 // 모바일 가상 가로 (세로는 화면 비율로 계산)
    narrowMinH: 460, narrowMaxH: 860,
    groundRatio: 0.72,               // 바닥 위치 = VIEW.h * 0.72
    worldW: 1280,
    walkSpeed: 155,
    introTrigger: 470,
    stageCx: 620,
    laneGap: 148,
    laneDash: 0.15,
    cupX: 1090,
    warn: 0.72,
    ghostX: 900
  };

  var LANE_X = [
    GAME_CONFIG.stageCx - GAME_CONFIG.laneGap,
    GAME_CONFIG.stageCx,
    GAME_CONFIG.stageCx + GAME_CONFIG.laneGap
  ];

  var VIEW = { w:GAME_CONFIG.viewWide, h:GAME_CONFIG.viewWideH };
  var GROUND = VIEW.h * GAME_CONFIG.groundRatio;   // 반응형 바닥

  /* 火雨 → 橫火 → 赤壁 : 고정 패턴 */
  var FIRE_PATTERNS = [
    { t:0.4,  lanes:[0],   kind:"down" },
    { t:1.6,  lanes:[2],   kind:"down" },
    { t:2.8,  lanes:[1],   kind:"down" },
    { t:3.9,  lanes:[0,2], kind:"down" },
    { t:5.1,  lanes:[1],   kind:"down" },

    { t:6.3,  lanes:[0],   kind:"side" },
    { t:7.4,  lanes:[2],   kind:"side" },
    { t:8.5,  lanes:[1],   kind:"side" },
    { t:9.6,  lanes:[0,1], kind:"side" },
    { t:10.8, lanes:[1,2], kind:"side" },

    { t:12.1, lanes:[0,2], kind:"down" },
    { t:13.4, lanes:[1,2], kind:"side" },
    { t:14.7, lanes:[0,1], kind:"down" },
    { t:16.0, lanes:[1,2], kind:"down" },
    { t:17.3, lanes:[0,2], kind:"side" }
  ];
  var DODGE_END = 18.6;

  var TEXT = {
    fan:  { hz:"羽扇綸巾", rd:"우선윤건" },
    war:  { hz:"談笑間，強虜灰飛煙滅", rd:"담소간, 강로회비연멸" },
    self: { hz:"多情應笑我，早生華髮", rd:"다정응소아, 조생화발" },
    turn: { nt:"시선은 결국 자신에게 돌아온다." },
    tip:  { nt:"← → 로 불씨를 피한다" }
  };

  var reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var isTouch = (navigator.maxTouchPoints || 0) > 0 || "ontouchstart" in window;

  /* ════════════ PLAYER / STATE ════════════ */

  var PLAYER = {
    x:110, dir:1, moving:false, phase:0, white:false,
    lane:1, laneFrom:0, laneT:1,
    cup:0, pour:0, flash:0
  };

  var state = {
    mode:"title", t:0, camera:0, camLock:null,
    gauge:20, combo:0,
    ghost:0, ghostScale:1, fanOnly:0,
    red:0, dim:0, shake:0, freeze:0,
    hazards:[], evt:0, floats:[],
    holding:false, capKey:null
  };

  /* 고정 배경 */
  var STARS = [], ROCKS = [], REEDS = [];
  (function(){
    var seed = 20240211;
    function rnd(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    var i;
    for (i = 0; i < 38; i++) STARS.push({ x: rnd() * GAME_CONFIG.worldW, y: rnd(), a:.15 + rnd() * .4 });
    var xs = [230, 430, 760, 980, 1160];
    for (i = 0; i < xs.length; i++) ROCKS.push({ x: xs[i], w: 32 + (i % 3) * 16, h: 11 + (i % 4) * 5 });
    for (var x = 150; x < GAME_CONFIG.worldW; x += 170) REEDS.push({ x: x + (x % 60), n: 3 + (x % 3) });
  })();

  /* ════════════ DOM ════════════ */

  var app = document.getElementById("app");
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var frame = document.getElementById("frame");
  var hud = document.getElementById("hud");
  var gaugeEl = document.getElementById("gauge");
  var gFill = document.getElementById("gFill");
  var comboEl = document.getElementById("combo");
  var capEl = document.getElementById("cap");
  var capHz = document.getElementById("capHz");
  var capRd = document.getElementById("capRd");
  var capNt = document.getElementById("capNt");
  var promptEl = document.getElementById("prompt");
  var holdbar = document.getElementById("holdbar");
  var holdFill = document.getElementById("holdFill");
  var titleEl = document.getElementById("title");
  var endEl = document.getElementById("ending");
  var pad = document.getElementById("pad");
  var kA = document.getElementById("kA");
  var hintEl = document.getElementById("hint");
  var keysText = document.getElementById("keysText");
  var hz = [document.getElementById("hz1"), document.getElementById("hz2"), document.getElementById("hz3")];

  if (isTouch) {
    hintEl.textContent = "◀ ▶ 이동 · 따르기 길게 누르기";
    keysText.innerHTML = "화면 아래 <b>◀ ▶</b> 로 이동<br>마지막에 <b>따르기</b> 를 길게 누른다";
  }

  /* ════════════ 레이아웃 / 크기 계산 ════════════ */

  function setAppHeight(){
    var h = window.innerHeight;
    if (window.visualViewport && window.visualViewport.height) {
      h = Math.min(h, window.visualViewport.height);
    }
    document.documentElement.style.setProperty("--app-height", h + "px");
  }

  function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }

  function layout(){
    setAppHeight();

    var cs = window.getComputedStyle(app);
    var padTop = num(cs.paddingTop), padBottom = num(cs.paddingBottom);
    var padLeft = num(cs.paddingLeft), padRight = num(cs.paddingRight);
    var gap = num(cs.rowGap || cs.gap) || 8;

    var availW = app.clientWidth - padLeft - padRight;
    var availH = app.clientHeight - padTop - padBottom
                 - pad.offsetHeight - hintEl.offsetHeight - gap * 2;

    if (availW < 220) availW = 220;
    if (availH < 150) availH = 150;

    /* 1) 가상 해상도 결정 */
    if (availW >= 560) {
      /* PC · 태블릿 : 16:9 */
      VIEW.w = GAME_CONFIG.viewWide;
      VIEW.h = GAME_CONFIG.viewWideH;
    } else {
      /* 모바일 세로 : 화면 비율에 맞춰 세로로 긴 가상 화면 */
      VIEW.w = GAME_CONFIG.viewNarrow;
      var vh = Math.round(VIEW.w * (availH / availW));
      if (vh < GAME_CONFIG.narrowMinH) vh = GAME_CONFIG.narrowMinH;
      if (vh > GAME_CONFIG.narrowMaxH) vh = GAME_CONFIG.narrowMaxH;
      VIEW.h = vh;
    }

    /* 2) 가상 비율을 그대로 유지해 남은 공간 안에 맞춘다 (왜곡 없음) */
    var aspect = VIEW.w / VIEW.h;
    var cssW = Math.min(availW, availH * aspect, 1080);
    var cssH = cssW / aspect;

    cssW = Math.floor(cssW);
    cssH = Math.floor(cssH);

    frame.style.width = cssW + "px";
    frame.style.height = cssH + "px";

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);

    /* 가상 좌표 → 실제 픽셀 (가로/세로 각각 맞춰 늘림) */
    ctx.setTransform((cv.width / VIEW.w), 0, 0, (cv.height / VIEW.h), 0, 0);

    GROUND = Math.round(VIEW.h * GAME_CONFIG.groundRatio);

    /* 카메라 재계산 */
    if (state.camLock !== null) state.camLock = lockCam();
    state.camera = clampCam(state.camera);
  }

  function clampCam(c){
    var max = GAME_CONFIG.worldW - VIEW.w;
    if (max < 0) max = 0;
    if (c < 0) c = 0;
    if (c > max) c = max;
    return c;
  }
  function lockCam(){
    return clampCam(GAME_CONFIG.stageCx - VIEW.w / 2 + 70);
  }

  var resizeTimer = null;
  function onResize(){
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 60);
    layout();
  }
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", function(){
    setTimeout(layout, 80);
    setTimeout(layout, 320);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", onResize);
    window.visualViewport.addEventListener("scroll", setAppHeight);
  }
  window.addEventListener("pageshow", layout);

  /* ════════════ INPUT ════════════ */

  var input = { left:false, right:false };

  function walkMode(){
    return state.mode === "intro" || state.mode === "reflect" || state.mode === "cup";
  }

  function stepLane(d){
    if (state.mode !== "dodge") return;
    var nl = PLAYER.lane + d;
    if (nl < 0 || nl > 2) return;
    PLAYER.laneFrom = PLAYER.x;
    PLAYER.lane = nl;
    PLAYER.laneT = 0;
  }
  function pressLeft(){ input.left = true; if (state.mode === "dodge") stepLane(-1); }
  function pressRight(){ input.right = true; if (state.mode === "dodge") stepLane(1); }

  document.addEventListener("keydown", function(e){
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") {
      e.preventDefault(); if (!e.repeat) pressLeft(); else input.left = true;
    } else if (k === "ArrowRight" || k === "d" || k === "D") {
      e.preventDefault(); if (!e.repeat) pressRight(); else input.right = true;
    } else if (k === " " || k === "Spacebar" || k === "e" || k === "E") {
      e.preventDefault();
      if (state.mode === "title") { start(); return; }
      state.holding = true;
    } else if (k === "Enter" && state.mode === "title") start();
  });
  document.addEventListener("keyup", function(e){
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") input.left = false;
    if (k === "ArrowRight" || k === "d" || k === "D") input.right = false;
    if (k === " " || k === "Spacebar" || k === "e" || k === "E") state.holding = false;
  });
  window.addEventListener("blur", function(){
    input.left = input.right = false; state.holding = false;
  });

  function bindKey(el, on, off){
    function down(e){ e.preventDefault(); el.classList.add("down"); on(); }
    function up(e){ if (e) e.preventDefault(); el.classList.remove("down"); if (off) off(); }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointerleave", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("contextmenu", function(e){ e.preventDefault(); });
    el.addEventListener("keydown", function(e){ if (e.key === " " || e.key === "Enter") { e.preventDefault(); on(); } });
    el.addEventListener("keyup", function(e){ if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (off) off(); } });
  }
  bindKey(document.getElementById("kL"), pressLeft, function(){ input.left = false; });
  bindKey(document.getElementById("kR"), pressRight, function(){ input.right = false; });
  bindKey(kA, function(){ state.holding = true; }, function(){ state.holding = false; });

  document.getElementById("btnStart").addEventListener("click", start);
  document.getElementById("btnAgain").addEventListener("click", restart);
  frame.addEventListener("touchmove", function(e){ e.preventDefault(); }, { passive:false });

  /* ════════════ UI ════════════ */

  function showCap(key, obj){
    if (state.capKey === key) return;
    state.capKey = key;
    if (!obj) { capEl.classList.remove("on"); return; }
    capHz.textContent = obj.hz || "";
    capRd.textContent = obj.rd || "";
    capNt.textContent = obj.nt || "";
    capHz.style.display = obj.hz ? "" : "none";
    capRd.style.display = obj.rd ? "" : "none";
    capNt.style.display = obj.nt ? "" : "none";
    capEl.classList.add("on");
  }
  function showPrompt(text){
    if (text) { promptEl.innerHTML = text; promptEl.classList.add("on"); kA.classList.remove("dimmed"); }
    else { promptEl.classList.remove("on"); kA.classList.add("dimmed"); }
  }
  function setStage(i){ for (var k = 0; k < 3; k++) hz[k].className = (k === i) ? "on" : ""; }
  function setGauge(){ gFill.style.width = Math.max(0, Math.min(100, state.gauge)) + "%"; }
  function setCombo(){
    if (state.combo >= 2) { comboEl.textContent = "連避 ×" + state.combo; comboEl.classList.add("on"); }
    else comboEl.classList.remove("on");
  }
  function float(text, x, y, color){
    state.floats.push({ text:text, x:x, y:y, life:1, color:color || "rgba(233,228,217,.9)" });
  }

  function start(){
    titleEl.classList.remove("on");
    state.mode = "intro"; state.t = 0;
    setStage(0);
    frame.focus({ preventScroll:true });
  }

  function restart(){
    endEl.classList.remove("on");
    PLAYER.x = 110; PLAYER.dir = 1; PLAYER.moving = false; PLAYER.phase = 0;
    PLAYER.white = false; PLAYER.lane = 1; PLAYER.laneT = 1; PLAYER.laneFrom = 0;
    PLAYER.cup = 0; PLAYER.pour = 0; PLAYER.flash = 0;

    state.mode = "title"; state.t = 0; state.camera = 0; state.camLock = null;
    state.gauge = 20; state.combo = 0;
    state.ghost = 0; state.ghostScale = 1; state.fanOnly = 0;
    state.red = 0; state.dim = 0; state.shake = 0; state.freeze = 0;
    state.hazards.length = 0; state.evt = 0; state.floats.length = 0;
    state.holding = false; state.capKey = "reset";

    input.left = input.right = false;
    showCap(null, null); showPrompt(null);
    gaugeEl.classList.remove("on"); setGauge(); setCombo();
    holdbar.classList.remove("on"); holdFill.style.width = "0";
    hud.classList.remove("fade");
    pad.classList.remove("hide");
    setStage(-1);
    titleEl.classList.add("on");
    layout();
    document.getElementById("btnStart").focus({ preventScroll:true });
  }

  /* ════════════ 회피 로직 ════════════ */

  function spawnHazard(lane, kind){
    var lx = LANE_X[lane];
    var h = { lane:lane, kind:kind, x:0, y:0, vx:0, vy:0,
              warn:GAME_CONFIG.warn, spawned:false, resolved:false, life:1 };
    var hitY = GROUND - 70;
    if (kind === "down") {
      h.x = lx; h.y = -34;
      h.vx = 0; h.vy = (hitY + 34) / 0.62;
    } else {
      var fromLeft = (lane !== 2);
      var sx = fromLeft ? state.camera - 40 : state.camera + VIEW.w + 40;
      var sy = Math.max(20, GROUND - 210);
      h.x = sx; h.y = sy;
      var tt = 0.72;
      h.vx = (lx - sx) / tt;
      h.vy = (hitY - sy) / tt;
    }
    state.hazards.push(h);
  }

  function resolveHazard(h){
    h.resolved = true;
    var dx = Math.abs(PLAYER.x - LANE_X[h.lane]);
    if (dx < 34) {
      PLAYER.flash = 0.28;
      state.shake = reduceMotion ? 0 : 6;
      state.gauge = Math.max(0, state.gauge - 9);
      state.combo = 0;
      float("被", PLAYER.x, GROUND - 108, "rgba(226,140,110,.95)");
    } else {
      state.gauge = Math.min(100, state.gauge + 6);
      state.combo += 1;
      if (dx < GAME_CONFIG.laneGap + 24) {
        state.gauge = Math.min(100, state.gauge + 2);
        float("近避", PLAYER.x, GROUND - 104, "rgba(226,236,244,.85)");
      }
    }
    setGauge(); setCombo();
  }

  /* ════════════ UPDATE ════════════ */

  function approach(cur, target, rate, dt){
    if (reduceMotion) return target;
    return cur + (target - cur) * Math.min(1, rate * dt);
  }
  function easeOut(t){ return 1 - Math.pow(1 - t, 3); }

  function update(dt){
    state.t += dt;
    if (state.freeze > 0) { state.freeze -= dt; dt = dt * 0.12; }

    /* ── 이동 ── */
    if (walkMode()) {
      var mv = (input.left ? -1 : 0) + (input.right ? 1 : 0);
      PLAYER.moving = mv !== 0;
      if (mv) {
        PLAYER.dir = mv;
        PLAYER.x += mv * GAME_CONFIG.walkSpeed * dt;
        PLAYER.phase += dt * 8.2;
      }
      var lo = (state.mode === "intro") ? 70 : LANE_X[0] - 40;
      var hi = (state.mode === "intro") ? 700 :
               (state.mode === "cup" ? GAME_CONFIG.cupX + 40 : LANE_X[2] + 40);
      if (PLAYER.x < lo) PLAYER.x = lo;
      if (PLAYER.x > hi) PLAYER.x = hi;
    } else if (state.mode === "dodge") {
      if (PLAYER.laneT < 1) {
        PLAYER.laneT = Math.min(1, PLAYER.laneT + dt / GAME_CONFIG.laneDash);
        PLAYER.x = PLAYER.laneFrom + (LANE_X[PLAYER.lane] - PLAYER.laneFrom) * easeOut(PLAYER.laneT);
        PLAYER.moving = true;
        PLAYER.phase += dt * 14;
      } else {
        PLAYER.x = LANE_X[PLAYER.lane];
        PLAYER.moving = false;
      }
      PLAYER.dir = 1;
    } else {
      PLAYER.moving = false;
    }

    /* ── 단계 ── */
    switch (state.mode) {
      case "intro":
        if (PLAYER.x > GAME_CONFIG.introTrigger) {
          state.mode = "vision"; state.t = 0;
          state.camLock = lockCam();
          setStage(1);
          input.left = input.right = false;
        }
        break;

      case "vision":
        state.dim = approach(state.dim, .3, 2, dt);
        state.fanOnly = Math.min(1, state.t / .5);
        if (state.t > .45) state.ghost = approach(state.ghost, 1, 2.4, dt);
        state.ghostScale = 1.5;
        if (state.t > .6 && state.t < 2.0) showCap("fan", TEXT.fan);
        else if (state.t >= 2.0 && state.t < 3.7) showCap("war", TEXT.war);
        if (state.t >= 3.7) {
          state.mode = "dodge"; state.t = 0; state.evt = 0;
          PLAYER.lane = 1; PLAYER.laneT = 1; PLAYER.x = LANE_X[1];
          state.dim = 0;
          gaugeEl.classList.add("on");
          showCap("tip", TEXT.tip);
        }
        break;

      case "dodge":
        state.ghostScale = approach(state.ghostScale, 1, 3, dt);
        var g01 = state.gauge / 100;
        state.ghost = approach(state.ghost, .2 + g01 * .8, 2, dt);
        state.red   = approach(state.red, .18 + g01 * .82, 1.6, dt);
        if (state.t > 1.8) showCap("none", null);

        while (state.evt < FIRE_PATTERNS.length && state.t >= FIRE_PATTERNS[state.evt].t) {
          var ev = FIRE_PATTERNS[state.evt];
          for (var i = 0; i < ev.lanes.length; i++) spawnHazard(ev.lanes[i], ev.kind);
          state.evt++;
        }
        if (state.t >= DODGE_END) {
          state.mode = "collapse"; state.t = 0;
          state.freeze = reduceMotion ? 0 : 0.22;
          gaugeEl.classList.remove("on");
          comboEl.classList.remove("on");
        }
        break;

      case "collapse":
        state.red = approach(state.red, 0, 1.3, dt);
        state.ghost = (state.t < .9) ? approach(state.ghost, 1, 4, dt)
                                     : approach(state.ghost, 0, 1.6, dt);
        for (var q = 0; q < state.hazards.length; q++) state.hazards[q].life -= dt * 1.4;
        if (state.t > 1.2) PLAYER.white = true;
        if (state.t >= 2.5) {
          state.mode = "reflect"; state.t = 0;
          state.camLock = null; setStage(2);
        }
        break;

      case "reflect":
        if (state.t < 2.6) showCap("self", TEXT.self);
        else if (state.t < 3.6) showCap("turn", TEXT.turn);
        if (state.t >= 3.6) { state.mode = "cup"; state.t = 0; showCap("none", null); }
        break;

      case "cup":
        var atCup = Math.abs(PLAYER.x - GAME_CONFIG.cupX) < 76;
        if (atCup) {
          showPrompt(isTouch ? "<b>[따르기]</b> 길게 눌러 강에 따른다"
                             : "<b>[SPACE]</b> 길게 눌러 강에 따른다");
          holdbar.classList.add("on");
          if (state.holding) {
            PLAYER.cup = Math.min(1, PLAYER.cup + dt * 3);
            PLAYER.pour = Math.min(1, PLAYER.pour + dt / 1.5);
          } else {
            PLAYER.pour = Math.max(0, PLAYER.pour - dt * 0.5);
          }
          holdFill.style.width = (PLAYER.pour * 100) + "%";
          if (PLAYER.pour >= 1) {
            state.mode = "poured"; state.t = 0;
            showPrompt(null);
            holdbar.classList.remove("on");
            hud.classList.add("fade");
            pad.classList.add("hide");
            input.left = input.right = false;
          }
        } else {
          showPrompt(null);
          holdbar.classList.remove("on");
          PLAYER.pour = Math.max(0, PLAYER.pour - dt * 0.6);
        }
        break;

      case "poured":
        if (state.t >= 2.0) {
          state.mode = "ending"; state.t = 0;
          endEl.classList.add("on");
          document.getElementById("btnAgain").focus({ preventScroll:true });
        }
        break;
    }

    /* ── 불꽃 ── */
    for (var h = state.hazards.length - 1; h >= 0; h--) {
      var z = state.hazards[h];
      if (!z.spawned) {
        z.warn -= dt;
        if (z.warn <= 0) z.spawned = true;
      } else {
        z.x += z.vx * dt;
        z.y += z.vy * dt;
        if (!z.resolved && z.y >= GROUND - 72) resolveHazard(z);
        if (z.resolved) z.life -= dt * 2.6;
      }
      if (z.life <= 0 || z.y > GROUND + 40) state.hazards.splice(h, 1);
    }

    /* ── 이펙트 ── */
    if (PLAYER.flash > 0) PLAYER.flash -= dt;
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 16);
    for (var f = state.floats.length - 1; f >= 0; f--) {
      var fl = state.floats[f];
      fl.life -= dt * 1.1; fl.y -= dt * 16;
      if (fl.life <= 0) state.floats.splice(f, 1);
    }

    /* ── 카메라 ── */
    var camT;
    if (state.camLock !== null) camT = state.camLock;
    else {
      camT = PLAYER.x - VIEW.w / 2 + 40 * PLAYER.dir;
      if (state.mode === "reflect") camT = PLAYER.x - VIEW.w / 2 + 10;
    }
    state.camera = clampCam(approach(state.camera, clampCam(camT), 3.6, dt));
  }

  /* ════════════ DRAW ════════════ */

  var T = 0;

  function mix(a, b, t){
    if (t <= 0) return a;
    if (t >= 1) return b;
    function hx(c){ return [parseInt(c.substr(1,2),16), parseInt(c.substr(3,2),16), parseInt(c.substr(5,2),16)]; }
    var A = hx(a), B = hx(b);
    return "rgb(" + Math.round(A[0]+(B[0]-A[0])*t) + "," +
                    Math.round(A[1]+(B[1]-A[1])*t) + "," +
                    Math.round(A[2]+(B[2]-A[2])*t) + ")";
  }

  function draw(){
    var W = VIEW.w, H = VIEW.h, cam = state.camera, G = GROUND;
    var r = state.red;

    ctx.save();
    if (state.shake > .1) ctx.translate((Math.random()-.5)*state.shake, (Math.random()-.5)*state.shake);

    /* 하늘 */
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, mix("#0d1a29", "#2a1620", r));
    sky.addColorStop(.55, mix("#0a1421", "#1e1220", r));
    sky.addColorStop(1, mix("#060d16", "#140b12", r));
    ctx.fillStyle = sky; ctx.fillRect(-12, -12, W+24, H+24);

    /* 별 (하늘 영역 비율로 배치) */
    ctx.fillStyle = "#dfe7f0";
    for (var i = 0; i < STARS.length; i++) {
      var s = STARS[i], sx = s.x - cam * .15;
      if (sx > -4 && sx < W+4) {
        ctx.globalAlpha = s.a * (1 - r*.7);
        ctx.fillRect(sx, 12 + s.y * (G * .52), 1.6, 1.6);
      }
    }
    ctx.globalAlpha = 1;

    /* 달 */
    var big = (state.mode === "reflect" || state.mode === "cup" ||
               state.mode === "poured" || state.mode === "ending");
    var mr = (28 + (big ? 15 : 0)) * (H / 540 > 1 ? 1.12 : 1);
    var mx = W*.74 - cam*.05, my = G*.32;
    var halo = ctx.createRadialGradient(mx, my, mr*.6, mx, my, mr*4);
    halo.addColorStop(0, "rgba(242,235,218," + (.16 - r*.09) + ")");
    halo.addColorStop(1, "rgba(242,235,218,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(mx, my, mr*4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = mix("#f2ebda", "#e6c4ae", r*.7);
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(190,180,158,.26)";
    ctx.beginPath(); ctx.arc(mx-mr*.3, my-mr*.2, mr*.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+mr*.25, my+mr*.3, mr*.13, 0, Math.PI*2); ctx.fill();

    /* 산 / 절벽 */
    drawRidge(cam*.22, G*.62, mix("#0b1622", "#1e131f", r), 150, G*.16);
    drawCliff(cam*.45, mix("#0a121d", "#1a1018", r));

    /* 회상 : 전선 + 불타는 배 */
    drawFleet(cam, G, r);

    /* 안개 */
    ctx.fillStyle = "rgba(150,175,200," + (.05 + r*.04) + ")";
    ctx.fillRect(0, G-66, W, 66);

    /* 강 */
    var riverY = G + 26;
    var riv = ctx.createLinearGradient(0, riverY, 0, H);
    riv.addColorStop(0, mix("#0a1826", "#1e1017", r));
    riv.addColorStop(1, mix("#040a12", "#100609", r));
    ctx.fillStyle = riv; ctx.fillRect(0, riverY, W, H-riverY+12);

    /* 달빛 반사 */
    var rows = Math.max(5, Math.min(12, Math.floor((H - riverY) / 11)));
    for (var k = 0; k < rows; k++) {
      var ry = riverY + 8 + k*9;
      if (ry > H) break;
      var wob = Math.sin(T*.9 + k) * (5 + PLAYER.pour*4);
      var ww = mr*1.6 - k*2;
      if (ww < 6) break;
      ctx.fillStyle = "rgba(238,230,210," + ((.17-k*.014)*(1-r*.45)) + ")";
      ctx.fillRect(mx-ww/2+wob, ry, ww, 2);
    }
    if (r > .35) {
      ctx.globalAlpha = (r-.35) * .5;
      for (k = 0; k < 5; k++) {
        var yy = riverY + 6 + k*11;
        if (yy > H) break;
        ctx.fillStyle = "rgba(178,96,68,.5)";
        ctx.fillRect(W*.15 + Math.sin(T*1.1+k)*8, yy, W*.55, 2);
      }
      ctx.globalAlpha = 1;
    }

    /* 지면 */
    ctx.fillStyle = mix("#0c151f", "#1c1016", r);
    ctx.fillRect(0, G, W, riverY-G+2);
    ctx.fillStyle = "rgba(150,172,196,.16)";
    ctx.fillRect(0, G, W, 1);

    /* 바위 */
    ctx.fillStyle = mix("#111c28", "#20131a", r);
    for (i = 0; i < ROCKS.length; i++) {
      var rk = ROCKS[i], rx = rk.x - cam;
      if (rx < -80 || rx > W+80) continue;
      ctx.beginPath();
      ctx.moveTo(rx-rk.w/2, G+2);
      ctx.quadraticCurveTo(rx-rk.w*.3, G-rk.h, rx, G-rk.h);
      ctx.quadraticCurveTo(rx+rk.w*.35, G-rk.h*.8, rx+rk.w/2, G+2);
      ctx.closePath(); ctx.fill();
    }

    /* 갈대 */
    ctx.strokeStyle = "rgba(120,142,164,.3)"; ctx.lineWidth = 1;
    for (i = 0; i < REEDS.length; i++) {
      var rd = REEDS[i], bx = rd.x - cam;
      if (bx < -30 || bx > W+30) continue;
      for (var j = 0; j < rd.n; j++) {
        var ox = bx + j*5 - 5;
        var sway = Math.sin(T*.7 + ox*.05) * 3;
        ctx.beginPath();
        ctx.moveTo(ox, G+4);
        ctx.quadraticCurveTo(ox+sway*.5, G-14, ox+sway, G-26);
        ctx.stroke();
      }
    }

    /* 레인 + 예고 */
    if (state.mode === "dodge" || state.mode === "collapse") drawLanes(cam, G);

    /* 술잔 */
    if ((state.mode === "reflect" || state.mode === "cup") && PLAYER.cup < .05)
      drawCupObject(GAME_CONFIG.cupX - cam, G);

    /* 주유 */
    if (state.ghost > .01) {
      ctx.save();
      ctx.globalAlpha = state.ghost * .9;
      drawZhouYu(GAME_CONFIG.ghostX - cam, G, state.ghostScale, state.fanOnly);
      ctx.restore();
    }

    /* 물에 비친 소식 */
    if (PLAYER.white && state.mode !== "ending") {
      ctx.save();
      ctx.globalAlpha = .3;
      ctx.translate(PLAYER.x - cam, G + 30);
      ctx.scale(1, -0.62);
      drawSuShi(0, 0, true, 1);
      ctx.restore();
    }

    /* 소식 */
    var blink = PLAYER.flash > 0 && Math.floor(PLAYER.flash*20) % 2 === 0;
    if (!blink) drawSuShi(PLAYER.x - cam, G, PLAYER.white, 1);

    /* 불꽃 */
    for (i = 0; i < state.hazards.length; i++) {
      if (state.hazards[i].spawned) drawEmber(state.hazards[i], cam);
    }

    /* 판정 텍스트 / 콤보 */
    ctx.textAlign = "center";
    ctx.font = "600 13px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif";
    for (i = 0; i < state.floats.length; i++) {
      var fl = state.floats[i];
      ctx.globalAlpha = Math.max(0, fl.life);
      ctx.fillStyle = fl.color;
      ctx.fillText(fl.text, fl.x - cam, fl.y);
    }
    ctx.globalAlpha = 1;
    if (state.mode === "dodge" && state.combo >= 2) {
      ctx.font = "500 11px 'Apple SD Gothic Neo','Noto Sans KR',sans-serif";
      ctx.fillStyle = "rgba(242,235,218,.6)";
      ctx.fillText("連避 ×" + state.combo, PLAYER.x - cam, G - 104);
    }
    ctx.textAlign = "start";

    /* 필터 */
    if (r > .01) {
      ctx.fillStyle = "rgba(150,68,46," + (r*.12) + ")";
      ctx.fillRect(-12, -12, W+24, H+24);
    }
    if (PLAYER.flash > 0) {
      ctx.fillStyle = "rgba(180,90,66," + (PLAYER.flash*.4) + ")";
      ctx.fillRect(-12, -12, W+24, H+24);
    }
    if (state.dim > .01) {
      ctx.fillStyle = "rgba(4,8,14," + state.dim + ")";
      ctx.fillRect(-12, -12, W+24, H+24);
    }
    if (state.mode === "poured" || state.mode === "ending") {
      var a = state.mode === "ending" ? .45 : Math.min(.45, state.t*.25);
      ctx.fillStyle = "rgba(4,8,14," + a + ")";
      ctx.fillRect(-12, -12, W+24, H+24);
    }

    ctx.restore();
  }

  function drawLanes(cam, G){
    for (var i = 0; i < 3; i++) {
      var x = LANE_X[i] - cam;
      ctx.fillStyle = "rgba(160,182,204,.07)";
      ctx.beginPath(); ctx.ellipse(x, G + 4, 46, 7, 0, 0, Math.PI*2); ctx.fill();
    }
    for (var h = 0; h < state.hazards.length; h++) {
      var z = state.hazards[h];
      if (z.spawned) continue;
      var lx = LANE_X[z.lane] - cam;
      var p = 1 - (z.warn / GAME_CONFIG.warn);
      var pulse = .25 + Math.abs(Math.sin(T * 7)) * .35;
      ctx.save();
      ctx.globalAlpha = pulse * (0.4 + p * 0.6);
      var g = ctx.createRadialGradient(lx, G, 2, lx, G, 52);
      g.addColorStop(0, "rgba(190,96,66,.55)");
      g.addColorStop(1, "rgba(190,96,66,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(lx, G + 2, 52, 14, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(230,160,120,.8)";
      ctx.beginPath(); ctx.arc(lx, VIEW.h * .06 + Math.sin(T*8)*3, 2.2, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  function drawRidge(off, baseY, color, span, height){
    var W = VIEW.w, H = VIEW.h;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(-10, H);
    var start = -((off % span) + span) % span;
    for (var x = start - span; x < W + span; x += span) {
      ctx.lineTo(x + span*.5, baseY - height*(.6 + .4*Math.sin(x*.013)));
      ctx.lineTo(x + span, baseY - height*.2);
    }
    ctx.lineTo(W+10, H); ctx.closePath(); ctx.fill();
  }

  function drawCliff(off, color){
    var W = VIEW.w, H = VIEW.h;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(-10, H);
    var pts = [[-200,300],[-60,232],[90,268],[210,190],[330,250],[470,214],
               [600,268],[740,206],[880,258],[1010,216],[1160,262],[1320,226],[1500,270]];
    var sy = GROUND / 392;                 /* 바닥 위치 기준으로 스케일 */
    var start = -((off % 1700) + 1700) % 1700;
    for (var k = 0; k < 2; k++)
      for (var i = 0; i < pts.length; i++)
        ctx.lineTo(start + k*1700 + pts[i][0] + 200, pts[i][1]*sy);
    ctx.lineTo(W+400, H); ctx.closePath(); ctx.fill();
  }

  function drawFleet(cam, G, r){
    if (r < .05) return;
    var ships = r < .35 ? 1 : (r < .65 ? 2 : 3);
    var base = [ [980, .55], [1120, .48], [860, .62] ];
    ctx.save();

    if (state.gauge > 78) {
      ctx.globalAlpha = Math.min(.5, (state.gauge - 78) / 40);
      var bx = 1050 - cam*.35, by = G - 96;
      ctx.fillStyle = "#0a0f16";
      ctx.beginPath();
      ctx.moveTo(bx-150, by+52);
      ctx.quadraticCurveTo(bx, by+78, bx+150, by+52);
      ctx.lineTo(bx+118, by+30); ctx.lineTo(bx-118, by+30);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(bx-6, by-70, 8, 100);
      ctx.beginPath();
      ctx.moveTo(bx-2, by-66); ctx.lineTo(bx+70, by-40); ctx.lineTo(bx-2, by-14);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }

    for (var i = 0; i < ships; i++) {
      var fx = base[i][0] - cam * base[i][1];
      var fy = G - 58 - i*14;
      ctx.globalAlpha = Math.min(1, r * 1.2);
      var gl = ctx.createRadialGradient(fx, fy, 3, fx, fy, 62);
      gl.addColorStop(0, "rgba(178,100,70,.5)");
      gl.addColorStop(1, "rgba(178,100,70,0)");
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(fx, fy, 62, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = "#0b1119";
      ctx.beginPath();
      ctx.moveTo(fx-34, fy+13);
      ctx.quadraticCurveTo(fx, fy+24, fx+34, fy+13);
      ctx.lineTo(fx+26, fy+6); ctx.lineTo(fx-26, fy+6);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(fx-2, fy-24, 3, 32);

      ctx.fillStyle = "rgba(186,110,78,.8)";
      for (var f = 0; f < 3; f++) {
        var h = 10 + Math.sin(T*3 + f + i) * 4;
        ctx.beginPath();
        ctx.moveTo(fx-14 + f*14, fy+6);
        ctx.quadraticCurveTo(fx-10 + f*14, fy+6-h, fx-6 + f*14, fy+6);
        ctx.closePath(); ctx.fill();
      }
      if (r > .55) {
        ctx.globalAlpha = (r-.55) * .5;
        ctx.fillStyle = "#151119";
        ctx.beginPath();
        ctx.ellipse(fx + Math.sin(T*.6+i)*6, fy-52, 26, 16, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();
  }

  function drawEmber(e, cam){
    var x = e.x - cam, y = e.y;
    if (x < -30 || x > VIEW.w + 30) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, e.life));
    var g = ctx.createRadialGradient(x, y, 0, x, y, 15);
    g.addColorStop(0, "rgba(230,150,108,.5)");
    g.addColorStop(1, "rgba(230,150,108,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = "rgba(198,116,84,.4)"; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - e.vx*.045, y - e.vy*.045);
    ctx.stroke();

    ctx.fillStyle = "#eab98f";
    ctx.beginPath(); ctx.ellipse(x, y, 2.6, 3.6, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawCupObject(x, G){
    if (x < -40 || x > VIEW.w + 40) return;
    ctx.save();
    ctx.globalAlpha = .6 + Math.sin(T*2)*.25;
    ctx.fillStyle = "rgba(242,235,218,.10)";
    ctx.beginPath(); ctx.arc(x, G-8, 16, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ded4bd";
    ctx.beginPath();
    ctx.moveTo(x-7, G-12); ctx.lineTo(x+7, G-12);
    ctx.lineTo(x+4, G-3); ctx.lineTo(x-4, G-3);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c6bca4";
    ctx.fillRect(x-5, G-2, 10, 2);
    ctx.restore();
  }

  /* ════════════ 캐릭터 ════════════ */

  function drawSuShi(x, y, white, scale){
    if (IMG.sushi) {
      var hgt = 104 * (scale || 1);
      var w = hgt * (IMG.sushi.width / IMG.sushi.height);
      ctx.save(); ctx.translate(x, y);
      if (PLAYER.dir < 0) ctx.scale(-1, 1);
      ctx.drawImage(IMG.sushi, -w/2, -hgt, w, hgt);
      ctx.restore();
      return;
    }

    var swing = PLAYER.moving ? Math.sin(PLAYER.phase) : Math.sin(T*1.1)*.12;
    var hem = swing * 2.4;

    ctx.save();
    ctx.translate(x, y);
    if (scale && scale !== 1) ctx.scale(scale, scale);
    if (PLAYER.dir < 0) ctx.scale(-1, 1);

    ctx.fillStyle = "rgba(0,0,0,.34)";
    ctx.beginPath(); ctx.ellipse(0, 2, 18, 4, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = "#0d1620";
    ctx.fillRect(-7 + swing*3.4, -16, 5, 16);
    ctx.fillRect(2 - swing*3.4, -16, 5, 16);
    ctx.fillStyle = "#070e15";
    ctx.fillRect(-9 + swing*3.4, -3, 8, 3);
    ctx.fillRect(1 - swing*3.4, -3, 8, 3);

    ctx.fillStyle = "#1b2634";
    ctx.beginPath();
    ctx.moveTo(-9, -66);
    ctx.quadraticCurveTo(-14, -40, -17 + hem, -6);
    ctx.quadraticCurveTo(0, -1, 17 + hem, -6);
    ctx.quadraticCurveTo(14, -40, 9, -66);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#223040";
    ctx.beginPath();
    ctx.moveTo(-6, -50);
    ctx.quadraticCurveTo(-4, -26, -9 + hem*.7, -7);
    ctx.quadraticCurveTo(0, -3, 9 + hem*.7, -7);
    ctx.quadraticCurveTo(4, -26, 6, -50);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#26333f";
    ctx.beginPath();
    ctx.moveTo(0, -70);
    ctx.quadraticCurveTo(-13, -68, -11, -58);
    ctx.lineTo(11, -58);
    ctx.quadraticCurveTo(13, -68, 0, -70);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#28353f";
    ctx.beginPath();
    ctx.moveTo(-10, -63);
    ctx.quadraticCurveTo(-21, -46, -17, -25);
    ctx.quadraticCurveTo(-12, -22, -9, -27);
    ctx.quadraticCurveTo(-11, -45, -6, -60);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = "rgba(202,212,220,.8)"; ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.moveTo(-5, -66); ctx.lineTo(0, -48); ctx.lineTo(5, -66);
    ctx.stroke();

    ctx.fillStyle = "#35434f";
    ctx.fillRect(-11, -37, 22, 4);
    ctx.fillStyle = "#2a3743";
    ctx.fillRect(-2, -33, 4, 9);

    if (PLAYER.cup > 0) {
      var a = -0.3 - PLAYER.pour * 1.05;
      ctx.save();
      ctx.translate(9, -54); ctx.rotate(a);
      ctx.fillStyle = "#28353f";
      ctx.beginPath();
      ctx.moveTo(0, -5); ctx.lineTo(21, -4); ctx.lineTo(21, 5); ctx.lineTo(0, 6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ded4bd";
      ctx.beginPath();
      ctx.moveTo(21, -7); ctx.lineTo(31, -7); ctx.lineTo(29, 2); ctx.lineTo(23, 2);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      if (PLAYER.pour > .25) {
        ctx.strokeStyle = "rgba(226,234,242,.45)"; ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(30, -38);
        ctx.quadraticCurveTo(37, -22, 35, -4);
        ctx.stroke();
      }
    } else {
      ctx.fillStyle = "#c2a486";
      ctx.beginPath(); ctx.ellipse(3, -36, 5, 3.4, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#28353f";
      ctx.beginPath();
      ctx.moveTo(10, -63);
      ctx.quadraticCurveTo(19, -48, 13, -34);
      ctx.quadraticCurveTo(8, -32, 6, -37);
      ctx.quadraticCurveTo(10, -48, 6, -60);
      ctx.closePath(); ctx.fill();
    }

    ctx.fillStyle = "#b6957a";
    ctx.fillRect(-3.5, -75, 7, 8);
    ctx.fillStyle = "#cfb492";
    ctx.beginPath();
    ctx.moveTo(-8, -84);
    ctx.quadraticCurveTo(-9, -72, -4, -68);
    ctx.quadraticCurveTo(0, -66, 4, -68);
    ctx.quadraticCurveTo(9, -72, 8, -84);
    ctx.quadraticCurveTo(0, -90, -8, -84);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = white ? "#ccd1d7" : "#141c26";
    ctx.beginPath(); ctx.moveTo(-8.5, -86); ctx.quadraticCurveTo(-11, -74, -6, -69);
    ctx.quadraticCurveTo(-9, -78, -7.5, -86); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8.5, -86); ctx.quadraticCurveTo(11, -74, 6, -69);
    ctx.quadraticCurveTo(9, -78, 7.5, -86); ctx.closePath(); ctx.fill();

    ctx.strokeStyle = "rgba(52,44,36,.9)"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-5.5, -81); ctx.lineTo(-1.5, -82); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1.5, -82); ctx.lineTo(5.5, -81); ctx.stroke();
    ctx.fillStyle = "#2c251f";
    ctx.fillRect(-5, -79, 3.2, 1.5);
    ctx.fillRect(1.8, -79, 3.2, 1.5);

    ctx.fillStyle = white ? "#bcc0c6" : "#494539";
    ctx.beginPath();
    ctx.moveTo(-4.5, -71); ctx.quadraticCurveTo(0, -68, 4.5, -71);
    ctx.quadraticCurveTo(3, -60, 0, -56);
    ctx.quadraticCurveTo(-3, -60, -4.5, -71);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#0f1923";
    ctx.beginPath();
    ctx.moveTo(-7.5, -87); ctx.lineTo(-7, -98);
    ctx.quadraticCurveTo(0, -101, 7, -98);
    ctx.lineTo(7.5, -87); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#0a141d";
    ctx.beginPath();
    ctx.moveTo(-10, -89); ctx.quadraticCurveTo(0, -84, 10, -89);
    ctx.lineTo(10, -85); ctx.quadraticCurveTo(0, -80, -10, -85);
    ctx.closePath(); ctx.fill();
    if (white) {
      ctx.strokeStyle = "rgba(232,237,242,.9)"; ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(-8.5, -84); ctx.lineTo(-11.5, -76);
      ctx.moveTo(8.5, -84); ctx.lineTo(11.5, -76);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawZhouYu(x, y, scale, fanOnly){
    scale = scale || 1;

    if (IMG.zhouyu) {
      var hgt = 112 * scale;
      var w = hgt * (IMG.zhouyu.width / IMG.zhouyu.height);
      ctx.save(); ctx.translate(x, y); ctx.scale(-1, 1);
      ctx.drawImage(IMG.zhouyu, -w/2, -hgt, w, hgt);
      ctx.restore();
      return;
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(-scale, scale);

    var bodyA = (fanOnly === undefined) ? 1 : Math.max(0, Math.min(1, (fanOnly - .35) / .5));

    ctx.save();
    ctx.globalAlpha = ctx.globalAlpha * bodyA;

    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.beginPath(); ctx.ellipse(0, 2, 17, 4, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = "#0f1a26";
    ctx.fillRect(-6, -17, 5, 17);
    ctx.fillRect(2, -17, 5, 17);

    ctx.fillStyle = "#31485f";
    ctx.beginPath();
    ctx.moveTo(-9, -72);
    ctx.quadraticCurveTo(-13, -42, -16, -5);
    ctx.quadraticCurveTo(0, -1, 16, -5);
    ctx.quadraticCurveTo(13, -42, 9, -72);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#3c5772";
    ctx.beginPath();
    ctx.moveTo(-6, -54); ctx.quadraticCurveTo(-4, -28, -9, -6);
    ctx.quadraticCurveTo(0, -3, 9, -6);
    ctx.quadraticCurveTo(4, -28, 6, -54);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#3a5470";
    ctx.beginPath();
    ctx.moveTo(0, -76); ctx.quadraticCurveTo(-13, -74, -11, -64);
    ctx.lineTo(11, -64); ctx.quadraticCurveTo(13, -74, 0, -76);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#3c5772";
    ctx.beginPath();
    ctx.moveTo(-10, -69); ctx.quadraticCurveTo(-20, -50, -16, -30);
    ctx.quadraticCurveTo(-11, -27, -8, -32);
    ctx.quadraticCurveTo(-10, -50, -6, -66);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = "rgba(232,238,244,.9)"; ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.moveTo(-5, -72); ctx.lineTo(0, -54); ctx.lineTo(5, -72); ctx.stroke();

    ctx.fillStyle = "#496073";
    ctx.fillRect(-10, -42, 20, 4);

    ctx.fillStyle = "#c3a385";
    ctx.fillRect(-3.5, -81, 7, 8);
    ctx.fillStyle = "#e2c8a6";
    ctx.beginPath();
    ctx.moveTo(-7.5, -90);
    ctx.quadraticCurveTo(-8.5, -78, -4, -74);
    ctx.quadraticCurveTo(0, -72, 4, -74);
    ctx.quadraticCurveTo(8.5, -78, 7.5, -90);
    ctx.quadraticCurveTo(0, -96, -7.5, -90);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#141d27";
    ctx.beginPath(); ctx.moveTo(-8, -92); ctx.quadraticCurveTo(-10, -80, -6, -75);
    ctx.quadraticCurveTo(-9, -84, -7, -92); ctx.closePath(); ctx.fill();

    ctx.strokeStyle = "rgba(46,38,30,.9)"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-5.5, -87); ctx.lineTo(-1.5, -88); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1.5, -88); ctx.lineTo(5.5, -87); ctx.stroke();
    ctx.fillStyle = "#2b241e";
    ctx.fillRect(-5, -85, 3.2, 1.5);
    ctx.fillRect(1.8, -85, 3.2, 1.5);

    ctx.fillStyle = "#e6ecf2";
    ctx.beginPath();
    ctx.moveTo(-8, -93); ctx.quadraticCurveTo(0, -106, 8, -93);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ccd6de";
    ctx.beginPath();
    ctx.moveTo(-9.5, -94); ctx.quadraticCurveTo(0, -89, 9.5, -94);
    ctx.lineTo(9.5, -90); ctx.quadraticCurveTo(0, -85, -9.5, -90);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(8, -96); ctx.quadraticCurveTo(16, -92, 15, -80);
    ctx.quadraticCurveTo(11, -87, 7, -90); ctx.closePath(); ctx.fill();

    ctx.restore();

    /* 부채 (먼저 보인다) */
    ctx.fillStyle = "#3c5772";
    ctx.globalAlpha = ctx.globalAlpha * Math.max(bodyA, 0);
    ctx.beginPath();
    ctx.moveTo(9, -68); ctx.quadraticCurveTo(18, -58, 15, -46);
    ctx.quadraticCurveTo(10, -44, 7, -48);
    ctx.quadraticCurveTo(10, -58, 6, -66);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(15, -48); ctx.rotate(.32);
    ctx.fillStyle = "#63503f"; ctx.fillRect(-1.6, -2, 3.2, 11);
    ctx.fillStyle = "#f0ead9";
    ctx.beginPath(); ctx.ellipse(0, -17, 10, 16, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(186,178,160,.9)"; ctx.lineWidth = .8;
    for (var f = -2; f <= 2; f++) {
      ctx.beginPath();
      ctx.moveTo(0, -3);
      ctx.lineTo(f * 3.4, -31);
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(210,202,184,.9)";
    ctx.beginPath(); ctx.ellipse(0, -17, 10, 16, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  /* ════════════ 루프 ════════════ */

  var last = 0;
  function loop(ts){
    if (!last) last = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;
    T += dt;
    if (state.mode !== "title") update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  setStage(-1);
  setGauge();
  layout();
  window.addEventListener("load", layout);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
